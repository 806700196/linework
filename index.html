<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>藍新金流 - 異常訂單取消申請</title>
  <style>
    :root {
      --primary: #0052ff;
      --primary-hover: #0042cc;
      --bg: #eef1f5;
      --card-bg: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #8c8c8c;
      --text-label: #333333;
      --border-color: #dcdfe6;
      --border-focus: #0052ff;
      --danger: #e62412;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .mobile-wrapper {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    /* 顶栏 Header */
    .top-header {
      background: #ffffff;
      padding: 12px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f0f0f0;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .icon-btn {
      border: none;
      background: none;
      font-size: 20px;
      color: #666;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }

    .header-center {
      text-align: center;
      flex: 1;
      padding: 0 8px;
    }

    .page-title {
      font-size: 15px;
      font-weight: 700;
      color: #1f1f1f;
      margin: 0;
      line-height: 1.3;
    }

    .page-url {
      font-size: 11px;
      color: #8c8c8c;
      margin: 2px 0 0;
      word-break: break-all;
    }

    /* 品牌蓝 banner Header */
    .brand-banner {
      background-color: var(--primary);
      color: #ffffff;
      padding: 24px 16px 32px;
      text-align: center;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 6px;
      letter-spacing: 0.5px;
    }

    .brand-subtitle {
      font-size: 13px;
      opacity: 0.9;
      margin: 0;
    }

    /* 主要内容容器 */
    .content-container {
      padding: 0 16px 24px;
      margin-top: -16px;
      flex: 1;
    }

    .form-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px 16px 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    /* 信息行 (商家资讯 & 交易类型) */
    .info-group {
      margin-bottom: 20px;
    }

    .group-title {
      font-size: 15px;
      font-weight: 700;
      color: #1b2559;
      margin-bottom: 12px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      font-size: 14px;
      border-bottom: 1px dashed #f0f0f0;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: var(--text-muted);
    }

    .info-value {
      color: #333333;
      font-weight: 600;
    }

    .info-value.danger {
      color: var(--danger);
      font-weight: 700;
    }

    .divider {
      height: 1px;
      background: #f0f0f0;
      margin: 16px 0 20px;
    }

    /* 模块标题 */
    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: #1b2559;
      margin: 0 0 16px 0;
    }

    /* 表单字段 */
    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-label);
    }

    label .required {
      color: var(--danger);
      margin-left: 2px;
    }

    input {
      width: 100%;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text-main);
      background-color: #ffffff;
      transition: all 0.2s ease;
      outline: none;
    }

    input::placeholder {
      color: #bfbfbf;
    }

    input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(0, 82, 255, 0.1);
    }

    /* 提交按钮 */
    .btn-submit {
      width: 100%;
      border: none;
      border-radius: 12px;
      background-color: var(--primary);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 82, 255, 0.25);
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 底部加密提示与公司版权信息 */
    .security-notice {
      margin-top: 20px;
      font-size: 12px;
      color: #8c8c8c;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .company-footer {
      margin-top: 12px;
      text-align: center;
      font-size: 11px;
      color: #8c8c8c;
      line-height: 1.6;
    }

    .company-footer p {
      margin: 2px 0;
    }

    .hint-msg {
      margin-top: 8px;
      font-size: 12px;
      color: var(--danger);
      text-align: center;
    }

    /* 弹窗 Modal 样式 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      backdrop-filter: blur(2px);
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 310px;
      border-radius: 16px;
      padding: 28px 24px 22px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      animation: modalFadeIn 0.2s ease-out;
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.92);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-icon {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      margin: 0 0 10px 0;
    }

    .modal-desc {
      font-size: 13px;
      color: #666666;
      margin: 0 0 22px 0;
      line-height: 1.5;
    }

    .modal-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      background-color: var(--primary);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      padding: 12px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .modal-btn:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>
  <div class="mobile-wrapper">
    <!-- 顶部导航栏 (模拟浏览器/APP顶栏) -->
    <header class="top-header">
      <button class="icon-btn" aria-label="返回">&lt;</button>
      <div class="header-center">
        <h1 class="page-title">藍新金流 - 異常訂單取消申請</h1>
        <div class="page-url">https://pay.newebpay.biz</div>
      </div>
      <button class="icon-btn" aria-label="关闭">&times;</button>
    </header>

    <!-- 品牌蓝 Banner 头部 -->
    <div class="brand-banner">
      <h2 class="brand-title">藍新金流 NewebPay</h2>
      <p class="brand-subtitle">異常訂單取消申請</p>
    </div>

    <!-- 主要表单卡片区域 -->
    <main class="content-container">
      <div class="form-card">
        <!-- 商家资讯组 -->
        <div class="info-group">
          <div class="group-title">商家資訊</div>
          <div class="info-row">
            <span class="info-label">商家名稱</span>
            <span class="info-value">CACO 加州椰子</span>
          </div>
          <div class="info-row">
            <span class="info-label">交易類型</span>
            <span class="info-value danger">異常訂單</span>
          </div>
        </div>

        <div class="divider"></div>

        <!-- 申请人资讯标题 -->
        <div class="section-title">申請人資訊</div>

        <form id="addForm">
          <div class="field">
            <label for="name">姓名 <span class="required">*</span></label>
            <input id="name" name="name" type="text" placeholder="請輸入申請人真實姓名" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="phone">聯絡電話 <span class="required">*</span></label>
            <input id="phone" name="phone" type="tel" placeholder="例：0912345678" autocomplete="tel" required>
          </div>

          <button id="addBtn" class="btn-submit" type="submit">提交申請</button>
        </form>

        <div class="security-notice">
          <span>🔒 SSL 安全加密傳輸</span>
        </div>

        <div class="company-footer">
          <p class="company-name">藍新金流股份有限公司 NewebPay</p>
          <p class="copyright">&copy; 2024 NewebPay. All Rights Reserved</p>
        </div>

        <div id="hint" class="hint-msg"></div>
      </div>
    </main>
  </div>

  <!-- 提交成功确认弹窗 Modal -->
  <div id="successModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-icon">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="12" fill="#52C41A"/>
          <path d="M14 24L21 31L34 17" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h3 class="modal-title">資料提交完成</h3>
      <p class="modal-desc">點擊確定跳轉至線上專員為您處理</p>
      <button id="modalConfirmBtn" class="modal-btn" type="button">確定</button>
    </div>
  </div>

  <script>
    // 测试用：LINE Developers 官方账号（公开可添加）
    // 正式使用时改成你自己的 ID；个人号不带 @，官方账号写成 @xxxx
    const LINE_ID = "@linedevelopers";

    function addFriendUrl(id) {
      const trimmed = String(id || "").trim().replace(/^~/, "");
      if (!trimmed) return "";
      if (trimmed.startsWith("@")) {
        return "https://line.me/R/ti/p/" + encodeURIComponent(trimmed);
      }
      return "https://line.me/ti/p/~" + encodeURIComponent(trimmed);
    }

    const form = document.getElementById("addForm");
    const btn = document.getElementById("addBtn");
    const hint = document.getElementById("hint");
    const modal = document.getElementById("successModal");
    const modalBtn = document.getElementById("modalConfirmBtn");
    const url = addFriendUrl(LINE_ID);

    if (!url) {
      btn.disabled = true;
      hint.textContent = "请先在 index.html 里填写 LINE_ID。";
    }

    // 提交表单时显示成功弹窗
    form.addEventListener("submit", function (event) {
      event.preventDefault();
      if (!url) return;
      modal.style.display = "flex";
    });

    // 弹窗点击确定后跳转 LINE
    modalBtn.addEventListener("click", function () {
      if (!url) return;
      window.location.href = url;
    });
  </script>
</body>
</html>
